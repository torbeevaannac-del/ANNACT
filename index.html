<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по гимнастике</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --success: #95E1D3;
            --error: #FF8B94;
            --bg: #F7FFF7;
            --text: #2D3436;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        #app {
            max-width: 800px;
            margin: 0 auto;
        }

        .screen {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        h2 {
            color: var(--secondary);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 3px solid var(--secondary);
            border-radius: var(--radius);
            font-size: 1.1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
            min-height: 44px;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .question-number {
            background: var(--accent);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #F8F9FA;
            border: 3px solid #E9ECEF;
            padding: 16px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
            min-height: 44px;
        }

        .option:hover {
            border-color: var(--secondary);
            background: #E3F9F7;
        }

        .option.selected {
            border-color: var(--primary);
            background: #FFE5E5;
        }

        .option.correct {
            border-color: var(--success);
            background: #D4F5E9;
        }

        .option.incorrect {
            border-color: var(--error);
            background: #FFE0E3;
        }

        .image-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .image-option {
            border: 3px solid #E9ECEF;
            border-radius: var(--radius);
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: #F8F9FA;
        }

        .image-option:hover {
            border-color: var(--secondary);
            transform: scale(1.05);
        }

        .image-option.selected {
            border-color: var(--primary);
            background: #FFE5E5;
        }

        .image-option.correct {
            border-color: var(--success);
            background: #D4F5E9;
        }

        .image-option.incorrect {
            border-color: var(--error);
            background: #FFE0E3;
        }

        .image-option svg {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            display: block;
        }

        .fill-blank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .fill-blank input {
            padding: 12px;
            border: 3px solid var(--secondary);
            border-radius: var(--radius);
            font-size: 1.1rem;
            min-width: 150px;
            flex: 1;
        }

        .fill-blank input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .progress-bar {
            background: #E9ECEF;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            transition: width 0.3s;
        }

        .result-card {
            background: linear-gradient(135deg, var(--success), var(--accent));
            padding: 30px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 20px;
        }

        .score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }

        .review-item {
            background: #F8F9FA;
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            border-left: 5px solid var(--secondary);
        }

        .review-item.correct {
            border-left-color: var(--success);
        }

        .review-item.incorrect {
            border-left-color: var(--error);
        }

        .review-question {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .review-answer {
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
        }

        .review-answer.correct {
            background: #D4F5E9;
            color: #155724;
        }

        .review-answer.incorrect {
            background: #FFE0E3;
            color: #721C24;
        }

        .error-message {
            background: var(--error);
            color: white;
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            flex: 1;
        }

        .btn-secondary {
            background: var(--secondary);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .screen {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .image-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <main id="app" role="main"></main>

    <script>
        // Константы: вопросы теста
        const QUESTIONS = [
            // Блок 1: Выбор правильного ответа (5 вопросов)
            {
                type: 'choice',
                question: 'Как называется упражнение, при котором тело опирается на руки, а ноги подняты вверх?',
                options: ['Стойка на руках', 'Мостик', 'Кувырок', 'Ласточка'],
                correct: 0
            },
            {
                type: 'choice',
                question: 'Какое упражнение помогает развить гибкость позвоночника?',
                options: ['Приседания', 'Мостик', 'Отжимания', 'Бег на месте'],
                correct: 1
            },
            {
                type: 'choice',
                question: 'Что нужно сделать перед началом тренировки по гимнастике?',
                options: ['Сразу начать сложные упражнения', 'Размяться', 'Поесть', 'Посидеть 10 минут'],
                correct: 1
            },
            {
                type: 'choice',
                question: 'Как называется гимнастический снаряд в виде бревна?',
                options: ['Брус', 'Бревно', 'Перекладина', 'Кольца'],
                correct: 1
            },
            {
                type: 'choice',
                question: 'Какое упражнение выполняется из положения стоя на одной ноге с поднятой другой ногой?',
                options: ['Ласточка', 'Мостик', 'Шпагат', 'Кувырок'],
                correct: 0
            },
            // Блок 2: Выбор правильного рисунка (5 вопросов)
            {
                type: 'image',
                question: 'Как выглядит стойка на руках?',
                images: [
                    { svg: 'stickman-hands', label: 'Человек стоит на руках' },
                    { svg: 'stickman-bridge', label: 'Человек в мостике' },
                    { svg: 'stickman-splits', label: 'Человек в шпагате' },
                    { svg: 'stickman-standing', label: 'Человек стоит прямо' }
                ],
                correct: 0
            },
            {
                type: 'image',
                question: 'Как выглядит мостик?',
                images: [
                    { svg: 'stickman-standing', label: 'Человек стоит прямо' },
                    { svg: 'stickman-bridge', label: 'Человек в мостике' },
                    { svg: 'stickman-hands', label: 'Человек стоит на руках' },
                    { svg: 'stickman-sitting', label: 'Человек сидит' }
                ],
                correct: 1
            },
            {
                type: 'image',
                question: 'Как выглядит шпагат?',
                images: [
                    { svg: 'stickman-hands', label: 'Человек стоит на руках' },
                    { svg: 'stickman-standing', label: 'Человек стоит прямо' },
                    { svg: 'stickman-splits', label: 'Человек в шпагате' },
                    { svg: 'stickman-bridge', label: 'Человек в мостике' }
                ],
                correct: 2
            },
            {
                type: 'image',
                question: 'Как выглядит упражнение "ласточка"?',
                images: [
                    { svg: 'stickman-splits', label: 'Человек в шпагате' },
                    { svg: 'stickman-swallow', label: 'Человек в ласточке' },
                    { svg: 'stickman-bridge', label: 'Человек в мостике' },
                    { svg: 'stickman-standing', label: 'Человек стоит прямо' }
                ],
                correct: 1
            },
            {
                type: 'image',
                question: 'Как выглядит кувырок вперед?',
                images: [
                    { svg: 'stickman-standing', label: 'Человек стоит прямо' },
                    { svg: 'stickman-bridge', label: 'Человек в мостике' },
                    { svg: 'stickman-sitting', label: 'Человек сидит' },
                    { svg: 'stickman-roll', label: 'Человек делает кувырок' }
                ],
                correct: 3
            },
            // Блок 3: Вставка пропущенного слова (5 вопросов)
            {
                type: 'fill',
                question: 'Перед тренировкой нужно сделать ____.',
                correct: 'разминка',
                hint: 'Подготовка мышц к нагрузке'
            },
            {
                type: 'fill',
                question: 'Упражнение, при котором ноги разведены в стороны на 180 градусов, называется ____.',
                correct: 'шпагат',
                hint: 'Ноги в разные стороны'
            },
            {
                type: 'fill',
                question: 'Гимнастический снаряд, на котором выполняют упражнения на равновесие, называется ____.',
                correct: 'бревно',
                hint: 'Длинный узкий снаряд'
            },
            {
                type: 'fill',
                question: 'Упражнение для развития гибкости спины, при котором тело выгибается дугой, называется ____.',
                correct: 'мостик',
                hint: 'Тело как дуга'
            },
            {
                type: 'fill',
                question: 'После тренировки обязательно нужно сделать ____ для восстановления мышц.',
                correct: 'заминка',
                hint: 'Упражнения в конце тренировки'
            }
        ];

        // Состояние приложения
        const state = {
            currentScreen: 'start', // start, quiz, results
            studentName: '',
            studentClass: '',
            currentQuestion: 0,
            answers: new Array(QUESTIONS.length).fill(null),
            showResults: false
        };

        // SVG генератор для рисунков гимнастических упражнений
        function generateSVG(type) {
            const svgs = {
                'stickman-hands': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="85" r="8" fill="#FF6B6B"/>
                    <line x1="50" y1="77" x2="50" y2="50" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="50" x2="35" y2="35" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="50" x2="65" y2="35" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="77" x2="40" y2="95" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="77" x2="60" y2="95" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-bridge': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="60" r="8" fill="#FF6B6B"/>
                    <path d="M 28 60 Q 50 40 72 60" stroke="#2D3436" stroke-width="3" fill="none"/>
                    <line x1="20" y1="68" x2="20" y2="85" stroke="#2D3436" stroke-width="3"/>
                    <line x1="72" y1="68" x2="72" y2="85" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-splits': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="30" r="8" fill="#FF6B6B"/>
                    <line x1="50" y1="38" x2="50" y2="60" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="60" x2="20" y2="75" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="60" x2="80" y2="75" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="35" y2="55" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="65" y2="55" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-standing': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="25" r="8" fill="#FF6B6B"/>
                    <line x1="50" y1="33" x2="50" y2="65" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="65" x2="40" y2="90" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="65" x2="60" y2="90" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="35" y2="55" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="65" y2="55" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-sitting': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="30" r="8" fill="#FF6B6B"/>
                    <line x1="50" y1="38" x2="50" y2="60" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="60" x2="35" y2="75" stroke="#2D3436" stroke-width="3"/>
                    <line x1="35" y1="75" x2="65" y2="75" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="35" y2="55" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="45" x2="65" y2="55" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-swallow': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="40" r="8" fill="#FF6B6B"/>
                    <line x1="50" y1="48" x2="50" y2="70" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="70" x2="50" y2="90" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="55" x2="25" y2="50" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="55" x2="75" y2="50" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="70" x2="70" y2="65" stroke="#2D3436" stroke-width="3"/>
                </svg>`,
                'stickman-roll': `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="20" fill="none" stroke="#2D3436" stroke-width="3"/>
                    <circle cx="50" cy="40" r="8" fill="#FF6B6B"/>
                    <path d="M 50 48 Q 45 55 50 62" stroke="#2D3436" stroke-width="3" fill="none"/>
                    <line x1="50" y1="62" x2="45" y2="70" stroke="#2D3436" stroke-width="3"/>
                    <line x1="50" y1="62" x2="55" y2="70" stroke="#2D3436" stroke-width="3"/>
                </svg>`
            };
            return svgs[type] || svgs['stickman-standing'];
        }

        // Рендер экрана старта
        function renderStartScreen() {
            return `
                <div class="screen">
                    <h1>🤸 Тест по гимнастике</h1>
                    <p style="text-align: center; margin-bottom: 30px; font-size: 1.1rem;">
                        Проверь свои знания по гимнастике!
                    </p>
                    <form id="startForm">
                        <div class="form-group">
                            <label for="studentName">Фамилия Имя Отчество *</label>
                            <input type="text" id="studentName" required 
                                   placeholder="Иванов Иван Иванович"
                                   aria-label="Введите ваше ФИО">
                        </div>
                        <div class="form-group">
                            <label for="studentClass">Класс *</label>
                            <input type="text" id="studentClass" required 
                                   placeholder="9"
                                   aria-label="Введите ваш класс">
                        </div>
                        <button type="submit">Начать тест</button>
                    </form>
                </div>
            `;
        }

        // Рендер вопроса
        function renderQuestion() {
            const question = QUESTIONS[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / QUESTIONS.length) * 100;
            
            let questionHTML = `
                <div class="screen">
                    <div class="progress-bar" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="question-card">
                        <div class="question-number">Вопрос ${state.currentQuestion + 1} из ${QUESTIONS.length}</div>
                        <div class="question-text">${question.question}</div>
            `;

            if (question.type === 'choice') {
                questionHTML += `<div class="options">`;
                question.options.forEach((option, index) => {
                    const selected = state.answers[state.currentQuestion] === index ? 'selected' : '';
                    questionHTML += `
                        <button class="option ${selected}" 
                                data-index="${index}"
                                aria-pressed="${selected ? 'true' : 'false'}">
                            ${option}
                        </button>
                    `;
                });
                questionHTML += `</div>`;
            } else if (question.type === 'image') {
                questionHTML += `<div class="image-options">`;
                question.images.forEach((img, index) => {
                    const selected = state.answers[state.currentQuestion] === index ? 'selected' : '';
                    questionHTML += `
                        <div class="image-option ${selected}" 
                             data-index="${index}"
                             role="button"
                             tabindex="0"
                             aria-label="${img.label}"
                             aria-pressed="${selected ? 'true' : 'false'}">
                            ${generateSVG(img.svg)}
                            <div>${img.label}</div>
                        </div>
                    `;
                });
                questionHTML += `</div>`;
            } else if (question.type === 'fill') {
                const currentValue = state.answers[state.currentQuestion] || '';
                questionHTML += `
                    <div class="fill-blank">
                        <input type="text" 
                               id="fillAnswer" 
                               value="${currentValue}"
                               placeholder="${question.hint}"
                               aria-label="Введите пропущенное слово">
                    </div>
                `;
            }

            questionHTML += `
                    </div>
                    <div class="nav-buttons">
                        ${state.currentQuestion > 0 ? '<button class="btn-secondary" id="prevBtn">Назад</button>' : ''}
                        ${state.currentQuestion < QUESTIONS.length - 1 
                            ? '<button id="nextBtn">Далее</button>' 
                            : '<button id="finishBtn">Завершить</button>'}
                    </div>
                </div>
            `;

            return questionHTML;
        }

        // Рендер экрана результатов
        function renderResults() {
            let score = 0;
            let reviewHTML = '';

            QUESTIONS.forEach((question, index) => {
                const userAnswer = state.answers[index];
                let isCorrect = false;
                let userAnswerText = '';
                let correctAnswerText = '';

                if (question.type === 'choice') {
                    isCorrect = userAnswer === question.correct;
                    userAnswerText = userAnswer !== null ? question.options[userAnswer] : 'Не отвечено';
                    correctAnswerText = question.options[question.correct];
                } else if (question.type === 'image') {
                    isCorrect = userAnswer === question.correct;
                    userAnswerText = userAnswer !== null ? question.images[userAnswer].label : 'Не отвечено';
                    correctAnswerText = question.images[question.correct].label;
                } else if (question.type === 'fill') {
                    const normalizedUser = (userAnswer || '').toLowerCase().trim();
                    const normalizedCorrect = question.correct.toLowerCase().trim();
                    isCorrect = normalizedUser === normalizedCorrect;
                    userAnswerText = userAnswer || 'Не отвечено';
                    correctAnswerText = question.correct;
                }

                if (isCorrect) score++;

                reviewHTML += `
                    <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-question">${index + 1}. ${question.question}</div>
                        <div class="review-answer ${isCorrect ? 'correct' : 'incorrect'}">
                            <strong>Ваш ответ:</strong> ${userAnswerText}
                        </div>
                        ${!isCorrect ? `
                            <div class="review-answer correct">
                                <strong>Правильный ответ:</strong> ${correctAnswerText}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            const percentage = Math.round((score / QUESTIONS.length) * 100);
            let message = '';
            if (percentage >= 90) message = '🏆 Отлично! Ты настоящий знаток гимнастики!';
            else if (percentage >= 70) message = '👍 Хорошо! У тебя хорошие знания!';
            else if (percentage >= 50) message = '📚 Неплохо, но есть над чем поработать!';
            else message = '💪 Нужно повторить материал и попробовать снова!';

            return `
                <div class="screen">
                    <div class="result-card">
                        <h1>Результаты теста</h1>
                        <p style="font-size: 1.2rem;">${state.studentName}</p>
                        <p>Класс: ${state.studentClass}</p>
                        <div class="score">${score} / ${QUESTIONS.length}</div>
                        <p style="font-size: 1.3rem; font-weight: 600;">${percentage}%</p>
                        <p style="font-size: 1.2rem; margin-top: 15px;">${message}</p>
                    </div>
                    <h2>Проверка ответов</h2>
                    ${reviewHTML}
                    <button id="restartBtn">Пройти тест заново</button>
                </div>
            `;
        }

        // Основная функция рендеринга
        function render() {
            const app = document.getElementById('app');
            
            if (state.currentScreen === 'start') {
                app.innerHTML = renderStartScreen();
                attachStartHandlers();
            } else if (state.currentScreen === 'quiz') {
                app.innerHTML = renderQuestion();
                attachQuizHandlers();
            } else if (state.currentScreen === 'results') {
                app.innerHTML = renderResults();
                attachResultsHandlers();
            }
        }

        // Обработчики экрана старта
        function attachStartHandlers() {
            const form = document.getElementById('startForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('studentName').value.trim();
                const cls = document.getElementById('studentClass').value.trim();
                
                if (!name || !cls) {
                    alert('Пожалуйста, заполните все поля');
                    return;
                }

                state.studentName = name;
                state.studentClass = cls;
                state.currentScreen = 'quiz';
                state.currentQuestion = 0;
                state.answers = new Array(QUESTIONS.length).fill(null);
                render();
            });
        }

        // Обработчики экрана вопросов
        function attachQuizHandlers() {
            const question = QUESTIONS[state.currentQuestion];

            // Обработка выбора вариантов для choice и image
            if (question.type === 'choice') {
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', () => {
                        const index = parseInt(option.dataset.index);
                        state.answers[state.currentQuestion] = index;
                        render();
                    });
                });
            } else if (question.type === 'image') {
                document.querySelectorAll('.image-option').forEach(option => {
                    option.addEventListener('click', () => {
                        const index = parseInt(option.dataset.index);
                        state.answers[state.currentQuestion] = index;
                        render();
                    });
                    option.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            const index = parseInt(option.dataset.index);
                            state.answers[state.currentQuestion] = index;
                            render();
                        }
                    });
                });
            } else if (question.type === 'fill') {
                const input = document.getElementById('fillAnswer');
                input.addEventListener('input', (e) => {
                    state.answers[state.currentQuestion] = e.target.value;
                });
            }

            // Навигация
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const finishBtn = document.getElementById('finishBtn');

            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    state.currentQuestion--;
                    render();
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (state.answers[state.currentQuestion] === null || 
                        (question.type === 'fill' && !state.answers[state.currentQuestion].trim())) {
                        alert('Пожалуйста, выберите ответ');
                        return;
                    }
                    state.currentQuestion++;
                    render();
                });
            }

            if (finishBtn) {
                finishBtn.addEventListener('click', () => {
                    if (state.answers[state.currentQuestion] === null || 
                        (question.type === 'fill' && !state.answers[state.currentQuestion].trim())) {
                        alert('Пожалуйста, выберите ответ');
                        return;
                    }
                    state.currentScreen = 'results';
                    render();
                });
            }
        }

        // Обработчики экрана результатов
        function attachResultsHandlers() {
            const restartBtn = document.getElementById('restartBtn');
            restartBtn.addEventListener('click', () => {
                state.currentScreen = 'start';
                state.studentName = '';
                state.studentClass = '';
                state.currentQuestion = 0;
                state.answers = new Array(QUESTIONS.length).fill(null);
                render();
            });
        }

        // Инициализация
        function init() {
            render();
        }

        // Запуск приложения
        init();
    </script>
</body>
</html>
